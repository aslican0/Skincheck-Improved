<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKINCHECK - Admin Panel</title>
  <link rel="stylesheet" href="styles.css?v=12">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
    }
    @media (max-width: 768px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
    .admin-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }
    .admin-card h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      color: var(--text-primary);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: inherit;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 600px;
      overflow-y: auto;
    }
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .product-item-info strong {
      display: block;
      color: var(--text-primary);
    }
    .product-item-info span {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }
    .ai-upload-zone {
      border: 2px dashed var(--accent-primary);
      padding: 1.5rem;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      cursor: pointer;
      background: rgba(var(--accent-primary-rgb), 0.05);
    }
    .ai-upload-zone:hover {
      background: rgba(var(--accent-primary-rgb), 0.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>SKINCHECK Admin Panel</h1>
      <a href="index.html" class="btn btn-secondary">← Ana Uygulamaya Dön</a>
    </div>

    <div class="admin-grid">
      <!-- Add Product Form -->
      <div class="admin-card">
        <h2>Yeni Ürün Ekle</h2>
        
        <!-- Photo Upload for AI -->
        <div class="ai-upload-zone" id="aiUploadZone">
          <span style="font-size: 2rem;">📸</span>
          <p>Yapay Zeka ile Otomatik Doldur</p>
          <p style="font-size: 0.8rem; color: var(--text-secondary);">Ürün fotoğrafını seçin (Phase 3'te aktif olacak)</p>
          <input type="file" id="aiImageInput" accept="image/*" style="display: none;">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

        <!-- Manual Form -->
        <form id="addProductForm">
          <div class="form-group">
            <label>Marka *</label>
            <input type="text" id="pBrand" required placeholder="Örn: THE PUREST SOLUTIONS">
          </div>
          <div class="form-group">
            <label>Ürün Adı *</label>
            <input type="text" id="pName" required placeholder="Örn: AHA 10% + BHA 2% Peeling">
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="pCategory">
              <option value="Skincare">Cilt Bakımı (Skincare)</option>
              <option value="Bodycare">Vücut Bakımı (Bodycare)</option>
              <option value="Haircare">Saç Bakımı (Haircare)</option>
            </select>
          </div>
          <div class="form-group">
            <label>INCI İçerik Listesi (Virgülle ayırın) *</label>
            <textarea id="pIngredients" required placeholder="Aqua, Glycerin, Niacinamide..."></textarea>
          </div>
          <div class="form-group">
            <label>Fiyat / Miktar</label>
            <input type="text" id="pQuantity" placeholder="Örn: 30ml / 250 TL">
          </div>
          <div class="form-group">
            <label>Vegan Durumu</label>
            <select id="pVegan">
              <option value="unknown">Bilinmiyor</option>
              <option value="vegan">Vegan</option>
              <option value="not-vegan">Vegan Değil</option>
            </select>
          </div>
          <div class="form-group">
            <label>Barkod (Opsiyonel)</label>
            <input type="text" id="pBarcode" placeholder="Barkod numarası">
          </div>
          <div class="form-group">
            <label>Görsel URL (Opsiyonel)</label>
            <input type="text" id="pImageUrl" placeholder="https://...">
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">Ürünü Veritabanına Ekle</button>
        </form>
      </div>

      <!-- Product List -->
      <div class="admin-card">
        <h2>Türkiye Veritabanındaki Ürünler</h2>
        <div class="product-list" id="dbProductList">
          <p>Yükleniyor...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin.js?v=1"></script>
</body>
</html>
